definitions:
  commands.CreateProduct:
    properties:
      brand:
        minLength: 2
        type: string
      category_id:
        type: integer
      description:
        minLength: 10
        type: string
      details:
        items:
          $ref: '#/definitions/commands.ProductDetailInput'
        type: array
      features:
        items:
          $ref: '#/definitions/commands.ProductFeatureInput'
        type: array
      image:
        type: string
      is_featured:
        type: boolean
      is_new:
        type: boolean
      name:
        minLength: 3
        type: string
      sizes:
        items:
          type: string
        type: array
      slug:
        minLength: 3
        type: string
      specs:
        items:
          $ref: '#/definitions/commands.ProductSpecInput'
        type: array
      tags:
        items:
          type: string
        type: array
    required:
    - brand
    - category_id
    - name
    - slug
    type: object
  commands.CreateReview:
    properties:
      comment:
        minLength: 10
        type: string
      product_id:
        type: integer
      rating:
        maximum: 5
        minimum: 1
        type: integer
      user_id:
        type: integer
      user_name:
        type: string
    required:
    - comment
    - product_id
    - rating
    - user_id
    - user_name
    type: object
  commands.LoginUser:
    properties:
      password:
        type: string
      phone:
        type: string
    required:
    - password
    - phone
    type: object
  commands.ProductDetailInput:
    properties:
      color_key:
        type: string
      color_name:
        type: string
      discount:
        maximum: 100
        minimum: 0
        type: integer
      images:
        items:
          type: string
        type: array
      original_price:
        type: number
      price:
        minimum: 0
        type: number
      size_key:
        type: string
      stock:
        minimum: 0
        type: integer
    required:
    - price
    type: object
  commands.ProductFeatureInput:
    properties:
      feature:
        type: string
      order:
        type: integer
    required:
    - feature
    type: object
  commands.ProductSpecInput:
    properties:
      key:
        type: string
      order:
        type: integer
      value:
        type: string
    required:
    - key
    - value
    type: object
  commands.RegisterUser:
    properties:
      avatarIdentifier:
        type: string
      email:
        type: string
      first_name:
        minLength: 2
        type: string
      last_name:
        minLength: 2
        type: string
      password:
        description: Optional for OTP-based registration
        type: string
      phone:
        type: string
    required:
    - first_name
    - last_name
    - phone
    type: object
  commands.ReviewHelpfulType:
    enum:
    - helpful
    - notHelpful
    type: string
    x-enum-varnames:
    - ReviewHelpfulTypeHelpful
    - ReviewHelpfulTypeNotHelpful
  commands.SendOtp:
    properties:
      phone:
        type: string
      type:
        enum:
        - login
        - register
        type: string
    required:
    - phone
    - type
    type: object
  commands.UpdateProduct:
    properties:
      brand:
        minLength: 2
        type: string
      category_id:
        type: integer
      description:
        minLength: 10
        type: string
      details:
        items:
          $ref: '#/definitions/commands.ProductDetailInput'
        type: array
      features:
        items:
          $ref: '#/definitions/commands.ProductFeatureInput'
        type: array
      id:
        type: integer
      image:
        type: string
      is_featured:
        type: boolean
      is_new:
        type: boolean
      name:
        minLength: 3
        type: string
      sizes:
        items:
          type: string
        type: array
      slug:
        minLength: 3
        type: string
      specs:
        items:
          $ref: '#/definitions/commands.ProductSpecInput'
        type: array
      tags:
        items:
          type: string
        type: array
    required:
    - brand
    - category_id
    - id
    - name
    - slug
    type: object
  commands.UpdateReviewHelpful:
    properties:
      review_id:
        type: integer
      type:
        $ref: '#/definitions/commands.ReviewHelpfulType'
    required:
    - review_id
    - type
    type: object
  commands.VerifyOtp:
    properties:
      otp:
        type: string
      phone:
        type: string
      type:
        enum:
        - login
        - register
        type: string
    required:
    - otp
    - phone
    - type
    type: object
  http.HTTPError:
    properties:
      code:
        description: Error code (from error ID)
        type: string
      detail:
        type: string
      message:
        type: string
      request_id:
        description: Request ID for tracing
        type: string
      status:
        description: HTTP status text
        type: string
    type: object
  http.ResponseResult:
    properties:
      data: {}
      error:
        $ref: '#/definitions/http.HTTPError'
      page:
        type: integer
      pages:
        type: integer
      success:
        type: boolean
      total:
        type: integer
    type: object
info:
  contact: {}
paths:
  /api/v1/admin/products:
    post:
      consumes:
      - application/json
      description: Creates a new product with all its details, features, and specs
      parameters:
      - description: CreateProduct request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/commands.CreateProduct'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.ResponseResult'
      summary: Create a new product
      tags:
      - products
  /api/v1/admin/products/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes a product. Can perform soft delete or hard delete.
      parameters:
      - description: Product ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - description: 'Soft delete (default: true)'
        in: query
        name: soft_delete
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ResponseResult'
      summary: Delete a product
      tags:
      - products
    put:
      consumes:
      - application/json
      description: Updates an existing product. Only provided fields will be updated.
      parameters:
      - description: Product ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - description: UpdateProduct request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/commands.UpdateProduct'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ResponseResult'
      summary: Update a product
      tags:
      - products
  /api/v1/public/auth/refresh:
    post:
      consumes:
      - application/json
      description: Refreshes the access token using a valid refresh token from request
        body
      parameters:
      - description: Refresh token request
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Token refreshed successfully
          schema:
            $ref: '#/definitions/http.ResponseResult'
        "401":
          description: Invalid or expired refresh token
          schema:
            $ref: '#/definitions/http.ResponseResult'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/http.ResponseResult'
      summary: Refresh access token
      tags:
      - auth
  /api/v1/public/auth/send-otp:
    post:
      consumes:
      - application/json
      description: Sends OTP code to the provided phone number
      parameters:
      - description: SendOtp request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/commands.SendOtp'
      produces:
      - application/json
      responses:
        "200":
          description: OTP sent successfully
          schema:
            $ref: '#/definitions/http.ResponseResult'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/http.ResponseResult'
        "429":
          description: Too many requests
          schema:
            $ref: '#/definitions/http.ResponseResult'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/http.ResponseResult'
      summary: Send OTP
      tags:
      - auth
  /api/v1/public/auth/verify-otp:
    post:
      consumes:
      - application/json
      description: Verifies OTP code and returns token if user exists, or indicates
        if user needs to register
      parameters:
      - description: VerifyOtp request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/commands.VerifyOtp'
      produces:
      - application/json
      responses:
        "200":
          description: OTP verified successfully
          schema:
            $ref: '#/definitions/http.ResponseResult'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/http.ResponseResult'
        "401":
          description: Invalid OTP
          schema:
            $ref: '#/definitions/http.ResponseResult'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/http.ResponseResult'
      summary: Verify OTP
      tags:
      - auth
  /api/v1/public/categories:
    get:
      consumes:
      - application/json
      description: Retrieves all product categories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ResponseResult'
      summary: Get all categories
      tags:
      - categories
  /api/v1/public/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns an access token.
      parameters:
      - description: LoginUser
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/commands.LoginUser'
      produces:
      - application/json
      responses:
        "200":
          description: Access token
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request body or unknown provider
          schema:
            $ref: '#/definitions/http.ResponseResult'
        "401":
          description: Authentication failed
          schema:
            $ref: '#/definitions/http.ResponseResult'
        "422":
          description: Unprocessable input (validation failed)
          schema:
            $ref: '#/definitions/http.ResponseResult'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/http.ResponseResult'
      summary: Login user
      tags:
      - users
  /api/v1/public/logout:
    post:
      consumes:
      - application/json
      description: |-
        Logs out the authenticated user.
        Example success response: {"success": true}
        Example error response: {"success": false, "error": {"code": "USER_NOT_FOUND", "message": "User not found", "status": "Not Found"}}
      produces:
      - application/json
      responses:
        "200":
          description: Logout completed successfully
          schema:
            $ref: '#/definitions/http.ResponseResult'
        "400":
          description: Invalid request body or unknown provider
          schema:
            $ref: '#/definitions/http.ResponseResult'
        "401":
          description: User not authenticated
          schema:
            $ref: '#/definitions/http.ResponseResult'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/http.ResponseResult'
        "422":
          description: Unprocessable input (validation failed)
          schema:
            $ref: '#/definitions/http.ResponseResult'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/http.ResponseResult'
      summary: Logout user
      tags:
      - users
  /api/v1/public/products:
    get:
      consumes:
      - application/json
      description: Retrieves all products with optional filtering
      parameters:
      - description: Search query
        in: query
        name: q
        type: string
      - description: Category slug
        in: query
        name: category
        type: string
      - description: Minimum price
        in: query
        name: min
        type: number
      - description: Maximum price
        in: query
        name: max
        type: number
      - description: Minimum rating
        in: query
        name: rating
        type: number
      - description: Featured products only
        in: query
        name: featured
        type: boolean
      - description: Comma-separated tags
        in: query
        name: tags
        type: string
      - description: Sort order (price_asc, price_desc, rating, newest)
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ResponseResult'
      summary: Get all products
      tags:
      - products
  /api/v1/public/products/{id}/reviews:
    get:
      consumes:
      - application/json
      description: Retrieves all reviews for a specific product
      parameters:
      - description: Product ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ResponseResult'
      summary: Get reviews by product ID
      tags:
      - reviews
  /api/v1/public/products/{slug}:
    get:
      consumes:
      - application/json
      description: Retrieves a single product by its slug
      parameters:
      - description: Product slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ResponseResult'
      summary: Get product by slug
      tags:
      - products
  /api/v1/public/products/category/{category}:
    get:
      consumes:
      - application/json
      description: Retrieves all products in a specific category
      parameters:
      - description: Category slug
        in: path
        name: category
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ResponseResult'
      summary: Get products by category
      tags:
      - products
  /api/v1/public/products/featured:
    get:
      consumes:
      - application/json
      description: Retrieves all featured products
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ResponseResult'
      summary: Get featured products
      tags:
      - products
  /api/v1/public/register:
    post:
      consumes:
      - application/json
      description: Handles user registration by parsing the request body and invoking
        the registration command.
      parameters:
      - description: RegisterUser request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/commands.RegisterUser'
      produces:
      - application/json
      responses:
        "201":
          description: Registration successful
          schema:
            $ref: '#/definitions/http.ResponseResult'
        "400":
          description: Invalid request body or unknown provider
          schema:
            $ref: '#/definitions/http.ResponseResult'
        "409":
          description: User already exists
          schema:
            $ref: '#/definitions/http.ResponseResult'
        "422":
          description: Unprocessable input (validation failed)
          schema:
            $ref: '#/definitions/http.ResponseResult'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/http.ResponseResult'
      summary: Register a new user
      tags:
      - users
  /api/v1/public/reviews:
    post:
      consumes:
      - application/json
      description: Creates a new review for a product
      parameters:
      - description: CreateReview request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/commands.CreateReview'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ResponseResult'
      summary: Create a review
      tags:
      - reviews
  /api/v1/public/reviews/{id}:
    patch:
      consumes:
      - application/json
      description: Increments helpful or notHelpful count for a review
      parameters:
      - description: Review ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - description: UpdateReviewHelpful request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/commands.UpdateReviewHelpful'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ResponseResult'
      summary: Update review helpful count
      tags:
      - reviews
swagger: "2.0"
